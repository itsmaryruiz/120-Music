<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Base: márgenes seguros del iPhone (muesca y barra inferior) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: herramienta para el músico. Rail lateral en tableta/escritorio, barra inferior en teléfono. Hojas de acordes en monoespaciada para conservar la alineación acorde-sílaba. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f9; --ink:#0f172a; --muted:#5b6478; --line:#dde3ee;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e3ecfe; --chord:#1d4ed8;
  --sel:#2563eb; --sel-ink:#ffffff;
  --ok:#15803d; --ok-soft:#dcf3e4; --warn:#b4401c; --warn-soft:#fbe7df; --info:#0f766e; --info-soft:#d6f2ee;
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#121a2e; --surface-2:#1a2340; --ink:#e7ecf6; --muted:#97a2bd; --line:#26304a;
  --accent:#5b8cff; --accent-ink:#06102b; --accent-soft:#18264d; --chord:#8fb0ff;
  --sel:#5b8cff; --sel-ink:#06102b;
  --ok:#6bc690; --ok-soft:#173023; --warn:#f08d66; --warn-soft:#3a1d14; --info:#5fd4c4; --info-soft:#0f2e2b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --surface-2:#1a2340; --ink:#e7ecf6; --muted:#97a2bd; --line:#26304a;
  --accent:#5b8cff; --accent-ink:#06102b; --accent-soft:#18264d; --chord:#8fb0ff;
  --sel:#5b8cff; --sel-ink:#06102b;
  --ok:#6bc690; --ok-soft:#173023; --warn:#f08d66; --warn-soft:#3a1d14; --info:#5fd4c4; --info-soft:#0f2e2b;
  color-scheme:dark}
/* El modo en vivo fija su propia paleta (oscura por defecto) */
.live{--bg:#070b16; --surface:#101727; --surface-2:#182136; --ink:#f1f4fa; --muted:#929cb3; --line:#253049; --chord:#8fb0ff; --accent:#8fb0ff; --accent-ink:#06102b; --sel:#f1f3f8; --sel-ink:#07090e; --warn:#ff9a72; color-scheme:dark}
.live.claro{--bg:#ffffff; --surface:#f2f5fb; --surface-2:#e6ecf7; --ink:#0f172a; --muted:#5b6478; --line:#d8dfeb; --chord:#1d4ed8; --accent:#1d4ed8; --accent-ink:#fff; --sel:#0d1018; --sel-ink:#fff; --warn:#a33d18; color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.025em}
h2{font-size:19px;font-weight:700;letter-spacing:-.015em}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

.app{min-height:100%;display:grid;grid-template-columns:1fr}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav .brand{display:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;display:block}
main{padding:20px 16px 110px;max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:200px 1fr}
  .nav{position:sticky;top:0;height:100vh;height:100dvh;bottom:auto;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:18px 10px}
  .nav button{flex-direction:row;gap:10px;font-size:14.5px;padding:10px 12px;justify-content:flex-start}
  .nav .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;padding:4px 12px 16px;letter-spacing:-.02em;color:var(--accent)}
  .nav .brand span{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  main{padding:32px 32px 60px}
}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.sect{display:flex;flex-direction:column;gap:12px}
.sect > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-height:40px}
textarea.inp{font-family:var(--f-mono);font-size:13.5px;line-height:1.45;resize:vertical;min-height:320px;white-space:pre;overflow:auto;tab-size:4}
.bigsearch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 6%,transparent);padding:4px 14px}
.bigsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.bigsearch input{border:0;background:transparent;flex:1;min-width:0;font-size:18px;padding:12px 0;outline:none}
.bigsearch .ico{color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;min-width:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip .n{font-size:11.5px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.keygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (min-width:640px){.keygrid{grid-template-columns:repeat(12,1fr)}}
.keygrid .chip{min-width:0;padding:8px 0;border-radius:10px;font-family:var(--f-mono);font-size:14.5px}
.keygrid .chip.orig{box-shadow:inset 0 -3px 0 var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13.5px;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;letter-spacing:.01em}
.badge.key{font-family:var(--f-mono);background:var(--accent-soft);color:var(--chord);font-size:12.5px;padding:2px 9px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--info-soft);color:var(--info)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .t{font-weight:650;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);min-width:0}
.item .r{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;grid-row:span 2}
.item .snip{grid-column:1 / -1;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:6px 9px;margin-top:4px;overflow-wrap:anywhere}
.item .snip .sl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
mark{background:var(--accent-soft);color:var(--chord);border-radius:3px;padding:0 1px;font-weight:650}
.star{background:none;border:0;font-size:19px;line-height:1;padding:4px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--accent)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--info-soft);color:var(--info)}
.callout p{color:inherit;font-weight:550;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* Hoja de acordes */
.sheetwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;overflow-x:auto}
.sec{margin:0 0 18px}
.sec:last-child{margin-bottom:0}
.sec-h{font-family:var(--f-body);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.sec[data-type="coro"] .sec-h{color:var(--chord)}
pre.sheet{font-family:var(--f-mono);font-size:var(--sheet-size,15px);line-height:1.42;margin:0;white-space:pre;color:var(--ink)}
pre.sheet .c{color:var(--chord);font-weight:700}
pre.sheet .c.bad{color:var(--warn);text-decoration:underline dotted;text-underline-offset:3px}

.keybar{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.keynow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.keynow .big{font-family:var(--f-mono);font-size:30px;font-weight:700;color:var(--chord);line-height:1}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps .btn{justify-content:center;padding:8px 4px;font-family:var(--f-mono)}

.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.conf{font-size:11.5px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.job:first-child{border-top:0}
.job .st{font-size:13px}
.st.run{color:var(--info)} .st.err{color:var(--warn)} .st.ok{color:var(--ok)}

.setitem{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.setitem:first-child{border-top:0}
.setitem .num{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--muted);line-height:1;width:28px;text-align:right}
.setitem .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.edge{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.edge b{color:var(--chord)}
.linkmark{font-size:12px;color:var(--accent);font-weight:650}

.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:stretch;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:900px;display:flex;flex-direction:column;min-height:0}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .mb{overflow:auto;padding:16px;flex:1;min-height:0}
.pdfpage{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin:0 0 12px;background:#fff}
.docview{max-width:70ch;line-height:1.55}
.docview pre{white-space:pre-wrap}

/* Modo en vivo */
.live{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.lv-top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.lv-title{flex:1;min-width:0;display:flex;flex-direction:column}
.lv-title b{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-title span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.lv-title span em{font-style:normal;color:var(--chord);font-weight:700;font-size:15px}
.lv-sheet{flex:1;overflow:auto;padding:16px 16px 40px;-webkit-overflow-scrolling:touch}
.lv-sheet pre.sheet{font-size:var(--live-size,22px)}
.lv-sheet .sec-h{font-size:12px}
.lv-next{margin-top:20px;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.lv-next b{color:var(--chord);font-family:var(--f-mono)}
.lv-bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);justify-content:center}
.lv-bar button,.lv-top button{min-height:48px;min-width:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;padding:0 12px;font-family:var(--f-mono)}
.lv-bar .grp{display:flex;gap:6px}
.lv-panel{border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:60%;overflow:auto}
.lv-panel .keygrid .chip{min-height:46px;font-size:16px}
.live.locked .lv-bar button:not(#lvLockB), .live.locked .lv-top button:not(#lvLock){opacity:.35;pointer-events:none}
#lvLock[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--sel);color:var(--sel-ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
.roadmap li{margin:0 0 6px}
.roadmap{margin:0;padding-left:20px}
details summary{cursor:pointer;font-weight:650}
</style>

  <nav class="nav" id="nav" aria-label="Secciones">
    <div class="brand">120 Music<span>Repertorio</span></div>

<script>
/*ENGINE-START*/
/* ================= MOTOR MUSICAL (independiente de la interfaz) ================= */
const Music = (() => {
  const SH = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const BASE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const SOLF = {do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};
  const CHORD_RE = /^([A-G])([#b♯♭]?)((?:maj|Maj|M|min|mi|m|dim|°|ø|aug|\+|sus|add|alt|no|\d{1,2}|[#b♯♭](?=\d)|\(|\)|-(?=\d))*)(?:\/([A-G][#b♯♭]?|\d{1,2}))?$/;
  const accVal = a => (a==='#'||a==='♯') ? 1 : (a==='b'||a==='♭') ? -1 : 0;
  const mod = n => ((n % 12) + 12) % 12;

  function parse(raw){
    if(!raw || raw.length > 16) return null;
    const m = CHORD_RE.exec(raw);

        const colL = body.filter(i => i.x < gx), colR = body.filter(i => i.x >= gx);
        return [...linesToText(head, cw), '', ...linesToText(colL, cw), '', ...linesToText(colR, cw)].join('\n');
      }
    }
  }
  return linesToText(its, cw).join('\n');
}

/* ================= COPIA DE SEGURIDAD (validar y combinar) ================= */
const BACKUP_APP = '120 Music', BACKUP_VERSION = 1;
function checkBackup(b){
  if(!b || typeof b !== 'object' || b.app !== BACKUP_APP) return 'Este archivo no es una copia de seguridad de 120 Music.';
  if(!(b.version >= 1)) return 'La copia no indica su versión.';
  if(b.version > BACKUP_VERSION) return 'La copia se hizo con una versión más nueva de la app. Actualiza la app y vuelve a intentarlo.';
  if(!Array.isArray(b.songs) || !Array.isArray(b.setlists) || !Array.isArray(b.files)) return 'La copia está incompleta o dañada.';
  if(b.songs.some(s => !s || !s.id || !Array.isArray(s.sections))) return 'La copia tiene canciones dañadas.';
  if(b.setlists.some(l => !l || !l.id || !Array.isArray(l.items))) return 'La copia tiene listas dañadas.';
  if(b.files.some(f => !f || !f.id || typeof f.data !== 'string')) return 'La copia tiene documentos dañados.';
  return null;
}
/* Decide qué se guarda al restaurar. Nunca borra nada del teléfono:
   - Canción o lista con el mismo id: se reemplaza solo si la de la copia es más reciente.
   - Documento original con el mismo id: nunca se sobrescribe.
   - Ejemplos: si el teléfono ya tiene el mismo ejemplo, se usa el del teléfono. */
function planRestore(cur, b){
  const norm = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  const songsById = new Map(cur.songs.map(s => [s.id, s]));
  const exByTitle = new Map(cur.songs.filter(s => s.isExample).map(s => [norm(s.title), s.id]));
  const remap = new Map(), songs = [], c = {newSongs:0, updSongs:0, keptSongs:0, newSets:0, updSets:0, keptSets:0, newFiles:0};
  for(const s of b.songs){
    if(s.isExample && !songsById.has(s.id) && exByTitle.has(norm(s.title))){ remap.set(s.id, exByTitle.get(norm(s.title))); c.keptSongs++; continue; }
    const old = songsById.get(s.id);
    if(!old){ songs.push(s); c.newSongs++; }
    else if((s.updatedAt||0) > (old.updatedAt||0)){ songs.push(s); c.updSongs++; }
    else c.keptSongs++;
  }
  const setsById = new Map(cur.setlists.map(l => [l.id, l]));
  const hasExSet = cur.setlists.some(l => l.isExample), setlists = [];
  for(const l0 of b.setlists){
    const l = {...l0, items:l0.items.map(it => remap.has(it.songId) ? {...it, songId:remap.get(it.songId)} : it)};
    const old = setsById.get(l.id);
    if(!old && l.isExample && hasExSet){ c.keptSets++; continue; }
    if(!old){ setlists.push(l); c.newSets++; }
    else if((l.updatedAt||0) > (old.updatedAt||0)){ setlists.push(l); c.updSets++; }
    else c.keptSets++;
  }
  const have = new Set(cur.fileIds), files = b.files.filter(f => !have.has(f.id));
  c.newFiles = files.length;
  return {songs, setlists, files, counts:c};
}

function highlight(raw, words, phrase){
  const chars = [...raw]; const lower = chars.map(c => { const n = stripAcc(c).toLowerCase(); return n.length===1 && /[a-z0-9#]/.test(n) ? n : ' '; }).join('');
  const ranges = [];
  const add = re => { let m; while((m = re.exec(lower))){ ranges.push([m.index, m.index+m[0].length]); if(m[0].length===0) re.lastIndex++; } };
  try{
    if(phrase){ add(new RegExp('(?<![a-z0-9])' + phrase.split(' ').map(w=>w.replace(/[#]/g,'\\#')).join('\\s+'), 'g')); }
    for(const w of words||[]) if(w) add(new RegExp('(?<![a-z0-9])' + w.replace(/[#]/g,'\\#') + '(?![a-z0-9])', 'g'));
  }catch(e){}
  if(!ranges.length) return esc(raw);
  ranges.sort((a,b)=>a[0]-b[0]); const merged = [];
  for(const r of ranges){ const l = merged[merged.length-1]; if(l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push([...r]); }
  let out = '', i = 0;
  for(const [a,b] of merged){ out += esc(chars.slice(i,a).join('')) + '<mark>' + esc(chars.slice(a,b).join('')) + '</mark>'; i = b; }
  return out + esc(chars.slice(i).join(''));
}

/* ================= ALMACENAMIENTO LOCAL (IndexedDB) ================= */
const DBX = {db:null, ok:false, memFiles:new Map()};
function dbOpen(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('app-alabanza', 1);
      r.onupgradeneeded = () => { const d = r.result; for(const s of ['songs','files','setlists','prefs']) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:'id'}); };
      r.onsuccess = () => { DBX.db = r.result; DBX.ok = true; res(); };
      r.onerror = () => res();
      r.onblocked = () => res();
    }catch(e){ res(); }
  });
}
function dbReq(store, mode, fn){
  return new Promise(res => {
    if(!DBX.ok) return res(null);
    try{ const tx = DBX.db.transaction(store, mode); const r = fn(tx.objectStore(store)); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
const dbAll = s => dbReq(s,'readonly', st => st.getAll()).then(r => r || []);
const dbPut = (s, o) => { if(s==='files' && !DBX.ok) DBX.memFiles.set(o.id, o); return dbReq(s,'readwrite', st => st.put(o)); };
const dbDel = (s, id) => { if(s==='files') DBX.memFiles.delete(id); return dbReq(s,'readwrite', st => st.delete(id)); };
const dbGet = async (s, id) => (await dbReq(s,'readonly', st => st.get(id))) || (s==='files' ? DBX.memFiles.get(id) : null);

function flatHint(song){ let f=0, sh=0; for(const s of song.sections) for(const l of s.lines) for(const c of l.chords){ if(/^[A-G]b/.test(c.raw)) f++; if(/^[A-G]#/.test(c.raw)) sh++; } return f > sh; }
function edgeChords(song){ const all = []; for(const s of song.sections) for(const l of s.lines) for(const c of [...l.chords].sort((a,b)=>a.pos-b.pos)) if(c.ok) all.push(c.raw); return {first:all[0]||null, last:all[all.length-1]||null}; }
function tr(song, raw, semi, pref){ if(!raw) return '—'; return Music.transposeSym(raw, semi, Music.flatsFor(song.key, semi, pref, flatHint(song)), pref!=='auto'); }
function unknownChords(song){ const u = new Set(); for(const s of song.sections) for(const l of s.lines) for(const c of l.chords) if(!c.ok) u.add(c.raw); return [...u]; }
function hasText(song){ return song.sections.some(s => s.lines.some(l => l.lyric.trim() || l.chords.length)); }
function dupInfo(){
  const byT = new Map(), byL = new Map(), dups = new Set();
  for(const s of S.songs){
    const t = normText(s.title); if(t){ if(byT.has(t)){ dups.add(s.id); dups.add(byT.get(t)); } else byT.set(t, s.id); }
    const ix = S.index.get(s.id); const sig = ix && ix.lines.length >= 2 ? ix.lines[0].n + '|' + ix.lines[1].n : '';
    if(sig){ if(byL.has(sig)){ dups.add(s.id); dups.add(byL.get(sig)); } else byL.set(sig, s.id); }
  }
  return dups;
}

/* ================= HOJA DE ACORDES ================= */
function chordLineHTML(chords, semi, flats, respell){
  let len = 0, html = '';
  for(const c of [...chords].sort((a,b)=>a.pos-b.pos)){
    const t = c.ok ? Music.transposeSym(c.raw, semi, flats, respell) : c.raw;
    const col = Math.max(c.pos, len ? len+1 : 0);
    html += ' '.repeat(col - len) + (c.ok ? `<b class="c">${esc(t)}</b>` : `<b class="c bad" title="Acorde no reconocido: no se transporta">${esc(t)}</b>`);
    len = col + t.length;
  }
  return html;
}
function sheetHTML(song, semi, pref){
  if(!hasText(song)) return `<div class="empty">Esta canción todavía no tiene letra ni acordes. Ábrela en <b>Editar</b> para transcribirla viendo el documento original.</div>`;
  const flats = Music.flatsFor(song.key, semi, pref, flatHint(song)), respell = pref !== 'auto';
  return song.sections.map(sec => {
    const body = sec.lines.map(ln => {
      let out = '';
      if(ln.chords.length) out += chordLineHTML(ln.chords, semi, flats, respell) + (ln.lyric ? '\n' : '');
      if(ln.lyric || !ln.chords.length) out += esc(ln.lyric);
      return out;
    }).join('\n');
    return `<section class="sec" data-type="${esc(sec.type)}">${sec.label ? `<h4 class="sec-h">${esc(sec.label)}</h4>` : ''}<pre class="sheet">${body}</pre></section>`;
  }).join('');
}

function libRows(){

      else if(L.source === 'asignada'){ for(const sl of S.setlists) for(const it of sl.items) if(it.songId===s.id && it.key && L.keys.has(it.key.i) && modeOk(it.key.minor)) rows.push({s, k:it.key, via:'asignada', sl}); }
      else { if(!s.key || !modeOk(s.key.minor)) continue;
        if(L.keys.has(s.key.i)) rows.push({s, k:s.key, via:'original'});
        else for(const t of L.keys) rows.push({s, k:{i:t, minor:s.key.minor}, via:'propuesta'}); }
    }
  } else rows = S.songs.filter(s => L.mode==='all' || (s.key && modeOk(s.key.minor))).map(s => ({s, k:s.key, via:'original'}));
  if(L.fav) rows = rows.filter(r => r.s.favorite);
  if(L.tag) rows = rows.filter(r => (r.s.tags||[]).includes(L.tag));
  if(L.q.trim()){ const q = normText(L.q); rows = rows.filter(r => normText(r.s.title).includes(q) || normText(r.s.artist).includes(q)); }
  const by = {title:(a,b)=>a.s.title.localeCompare(b.s.title), artist:(a,b)=>(a.s.artist||'~').localeCompare(b.s.artist||'~'), key:(a,b)=>(a.k?a.k.i+(a.k.minor?.5:0):99)-(b.k?b.k.i+(b.k.minor?.5:0):99), recent:(a,b)=>(b.s.lastOpened||0)-(a.s.lastOpened||0)};
  return rows.sort(by[L.sort] || by.title);
}
function libListHTML(){
  const rows = libRows(); const dups = dupInfo();

function render(){
  const {view, params} = S.route;
  $('#main').innerHTML = VIEWS[view](params);
  document.querySelectorAll('#nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tabOf(view) ? 'page' : 'false'));
  AFTER[view] && AFTER[view](params);
}
const tabOf = v => ({cancion:'biblioteca', servicio:'servicios', revisar:'importar'})[v] || v;
function go(view, params={}, push=true){ if(push) S.stack.push(S.route); S.route = {view, params}; render(); window.scrollTo(0,0); }

/* ================= IMPORTACIÓN ================= */
function songFromText(text, {title='', fileName='', sourceName='', fileId=null}={}){
  const p = parseSongText(text, {fileName});
  const conf = {...p.meta.conf}; if(title) conf.title = 'alta';
  const empty = !p.stats.lyricLines && !p.stats.chords;
  return {id:uid(), title:title || p.meta.title || 'Sin título', artist:p.meta.artist || '', key:p.meta.key, conf,
    sections:p.sections, meta:{notes:p.meta.notes}, tags:[], favorite:false, createdAt:Date.now(), updatedAt:Date.now(), lastOpened:0,
    sourceFileId:fileId, sourceName: sourceName || fileName, status: empty ? 'sin-texto' : 'revisar'};
}
async function pdfExtract(buf, perPage){
  if(!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF. Revisa tu conexión la primera vez que abras la app.');
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf), isEvalSupported:false, useSystemFonts:true}).promise;
  const pages = [];
  for(let p=1; p<=pdf.numPages; p++){ const page = await pdf.getPage(p); const tc = await page.getTextContent(); pages.push(itemsToText(tc.items)); }
  const scanned = t => t.replace(/\s/g,'').length < 15;
  if(perPage) return pages.map((t,i) => ({text:t, page:i+1, scanned:scanned(t)}));
  return [{text:pages.join('\n\n'), scanned:pages.every(scanned)}];
}
async function importFiles(files){
  if(!files.length) return;
  for(const f of files){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const job = {id:uid(), name:f.name, kind:ext.toUpperCase(), status:'Leyendo…', state:'run', songIds:[]};
    S.jobs.unshift(job); if(S.route.view==='importar') render();
    try{
      const buf = await f.arrayBuffer();
      const fileRec = {id:uid(), name:f.name, ext, size:f.size, blob:new Blob([buf.slice(0)], {type:f.type || 'application/octet-stream'}), addedAt:Date.now(), status:'procesando'};
      let parts;
      if(ext === 'pdf'){ job.kind = 'PDF'; parts = await pdfExtract(buf.slice(0), S.prefs.perPage); }
      else if(ext === 'docx'){ job.kind = 'Word'; if(!window.mammoth) throw new Error('No se pudo cargar el lector de Word.'); const r = await mammoth.extractRawText({arrayBuffer:buf.slice(0)}); parts = [{text:r.value.replace(/\n\n/g,'\n'), scanned:!r.value.trim()}]; }
      else if(['txt','cho','chordpro','chopro','crd','pro'].includes(ext)){ job.kind = 'Texto'; parts = [{text:new TextDecoder('utf-8').decode(buf), scanned:false}]; }
      else if(ext === 'doc') throw new Error('Formato .doc antiguo: ábrelo en Word, guárdalo como .docx e impórtalo de nuevo.');
      else throw new Error('Formato no compatible. Usa PDF, .docx o texto.');
      await dbPut('files', fileRec);
      let noText = 0;
      for(const part of parts){
        const base = f.name.replace(/\.[^.]+$/,'') + (part.page ? ` (pág. ${part.page})` : '');
        const s = part.scanned ? {...songFromText('', {fileName:base+'.x', fileId:fileRec.id, sourceName:f.name}), status:'sin-texto'} : songFromText(part.text, {fileName:base+'.x', fileId:fileRec.id, sourceName:f.name});
        if(part.page) s.sourcePage = part.page;
        if(s.status === 'sin-texto') noText++;
        await saveSong(s); job.songIds.push(s.id);
      }
      fileRec.status = noText === parts.length ? 'sin-texto' : 'ok'; await dbPut('files', fileRec);
      job.state = noText === parts.length ? 'err' : 'ok';
      job.status = noText === parts.length ? 'Sin texto: parece escaneado. Original guardado; transcríbelo en la revisión.' : `${parts.length - noText} ${parts.length-noText===1?'canción lista':'canciones listas'} para revisar${noText?` · ${noText} sin texto`:''}`;
    }catch(err){ job.state = 'err'; job.status = 'Error: ' + (err && err.message ? err.message : 'no se pudo leer el archivo') + ' Ningún archivo se modificó.'; }
    if(S.route.view==='importar') render();
  }
}
function startReview(ids){
  const q = ids.filter(id => songById(id)); if(!q.length) return toast('No hay canciones por revisar');
  S.review = {queue:q, pos:0, text:songToText(songById(q[0]))};
  go('revisar', {});
}
function nextReview(){
  const R = S.review; R.pos++;
  while(R.pos < R.queue.length && !songById(R.queue[R.pos])) R.pos++;
  if(R.pos >= R.queue.length){ S.review = null; S.stack = []; go('biblioteca', {}, false); toast('Revisión terminada'); return; }
  R.text = songToText(songById(R.queue[R.pos])); S.route = {view:'revisar', params:{}}; render(); window.scrollTo(0,0);
}

async function openOriginal(fileId){
  const m = $('#modal'); const f = await dbGet('files', fileId);
  m.innerHTML = `<div class="box" role="dialog" aria-label="Documento original"><div class="mh"><b style="overflow-wrap:anywhere">${esc(f ? f.name : 'Original')}</b><button class="btn" data-act="closeModal">Cerrar</button></div><div class="mb" id="origbody"><p class="muted">Cargando…</p></div></div>`;
  m.hidden = false;
  const body = $('#origbody');
  if(!f){ body.innerHTML = `<p>No se encontró el documento original en este navegador.</p>`; return; }
  try{
    if(f.ext === 'pdf'){
      const buf = await f.blob.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf), isEvalSupported:false, useSystemFonts:true}).promise;
      body.innerHTML = pdf.numPages > 15 ? `<p class="muted small">Mostrando las primeras 15 de ${pdf.numPages} páginas.</p>` : '';
      for(let p=1; p<=Math.min(pdf.numPages, 15); p++){ const page = await pdf.getPage(p); const vp = page.getViewport({scale:1.6}); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.className = 'pdfpage'; body.appendChild(c); await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; }
    } else if(f.ext === 'docx'){
      const r = await mammoth.convertToHtml({arrayBuffer: await f.blob.arrayBuffer()});
      const d = document.createElement('div'); d.className = 'docview'; d.innerHTML = r.value; d.querySelectorAll('script,iframe,object,embed').forEach(n=>n.remove()); body.innerHTML = ''; body.appendChild(d);
    } else { body.innerHTML = `<pre class="sheet">${esc(await f.blob.text())}</pre>`; }
  }catch(e){ body.innerHTML = `<p>No se pudo mostrar el original: ${esc(e.message||'')}</p>`; }
}

const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtSize = n => n < 1e6 ? Math.max(1, Math.round(n/1e3)) + ' KB' : (n/1e6).toFixed(1).replace('.', ',') + ' MB';
const fmtDay = t => new Date(t).toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'});
function backupStatusHTML(){
  const last = S.prefs.lastBackup, mine = S.songs.filter(s => !s.isExample).length;
  if(!last) return mine ? `<b style="color:var(--warn)">Todavía no has hecho ninguna copia.</b>` : `<span class="muted">Todavía no has hecho ninguna copia.</span>`;
  const changed = [...S.songs, ...S.setlists].some(x => !x.isExample && (x.updatedAt||0) > last);
  return `Última copia: ${fmtDay(last)}.` + (changed ? ` <b style="color:var(--warn)">Hay cambios después de esa copia.</b>` : '');
}
function smallModal(title, body, buttons){
  const m = $('#modal');
  m.innerHTML = `<div class="box" role="dialog" aria-label="${esc(title)}" style="max-width:480px;align-self:center"><div class="mh"><b>${esc(title)}</b><button class="btn ghost" data-act="closeModal">Cerrar</button></div><div class="mb">${body}<div class="row" style="margin-top:14px">${buttons||''}</div></div></div>`;
  m.hidden = false;
}
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
function b64ToBlob(b64, type){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0; i<bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type: type||''}); }
async function storedFileIds(){ return DBX.ok ? ((await dbReq('files','readonly', st => st.getAllKeys())) || []) : [...DBX.memFiles.keys()]; }
async function buildBackup(){
  const stored = DBX.ok ? await dbAll('files') : [...DBX.memFiles.values()];
  const files = [];
  for(const f of stored){ if(!f.blob) continue; files.push({id:f.id, name:f.name, ext:f.ext, size:f.size, addedAt:f.addedAt, status:f.status, type:f.blob.type, data: await blobToB64(f.blob)}); }
  const data = {app:BACKUP_APP, version:BACKUP_VERSION, exportedAt:Date.now(), songs:S.songs, setlists:S.setlists, files};
  const name = `120-music-copia-${new Date().toISOString().slice(0,10)}.json`;
  return {file: new File([JSON.stringify(data)], name, {type:'application/json'}), counts:{songs:S.songs.length, setlists:S.setlists.length, files:files.length}};
}
function markBackup(){ S.prefs.lastBackup = Date.now(); savePrefs(); ACT.closeModal(); if(S.route.view === 'ajustes') render(); }
const canShareFile = f => { try{ return !!(navigator.canShare && navigator.canShare({files:[f]}) && matchMedia('(pointer:coarse)').matches); }catch(e){ return false; } };
async function readBackupFile(f){
  let b; try{ b = JSON.parse(await f.text()); }catch(e){ b = null; }
  const err = checkBackup(b);
  if(err) return smallModal('No se puede restaurar', `<p>${esc(err)}</p><p class="muted small">Elige el archivo que termina en .json y que hiciste con “Hacer copia de seguridad”.</p>`);
  const plan = planRestore({songs:S.songs, setlists:S.setlists, fileIds: await storedFileIds()}, b);
  const c = plan.counts, todo = plan.songs.length + plan.setlists.length + plan.files.length;
  S.restore = todo ? plan : null;
  const li = (n, one, many) => n ? `<li>${pl(n, one, many)}</li>` : '';
  smallModal('Restaurar copia', `
    <p class="small">Copia del ${esc(fmtDay(b.exportedAt||Date.now()))}: ${pl(b.songs.length,'canción','canciones')}, ${pl(b.setlists.length,'lista','listas')} y ${pl(b.files.length,'documento original','documentos originales')}.</p>
    ${todo ? `<p class="small">Se va a hacer esto:</p><ul class="small">${li(c.newSongs,'canción nueva','canciones nuevas')}${li(c.updSongs,'canción actualizada con la versión de la copia','canciones actualizadas con la versión de la copia')}${li(c.newSets,'lista nueva','listas nuevas')}${li(c.updSets,'lista actualizada','listas actualizadas')}${li(c.newFiles,'documento original nuevo','documentos originales nuevos')}</ul>
    ${c.keptSongs||c.keptSets ? `<p class="muted small">Ya están en este teléfono, iguales o más recientes: ${pl(c.keptSongs,'canción','canciones')} y ${pl(c.keptSets,'lista','listas')}. Esas se quedan como están.</p>` : ''}
    <p class="muted small">No se borra nada de lo que ya tienes.</p>`
    : `<p class="small">Este teléfono ya tiene todo lo que hay en la copia. No hace falta restaurar nada.</p>`}`,
    todo ? `<button class="btn pri" data-act="doRestore">Restaurar</button>` : '');
}
async function doRestore(b){
  const plan = S.restore; if(!plan) return;
  b.disabled = true; b.textContent = 'Restaurando…';
  let bad = 0;
  for(const f of plan.files){
    try{ await dbPut('files', {id:f.id, name:f.name, ext:f.ext, size:f.size, addedAt:f.addedAt, status:f.status, blob:b64ToBlob(f.data, f.type)}); }
    catch(e){ bad++; }
  }
  for(const s of plan.songs){ const i = S.songs.findIndex(x => x.id === s.id); if(i >= 0) S.songs[i] = s; else S.songs.push(s); S.index.set(s.id, buildIndex(s)); await dbPut('songs', s); }
  for(const l of plan.setlists){ const i = S.setlists.findIndex(x => x.id === l.id); if(i >= 0) S.setlists[i] = l; else S.setlists.push(l); await dbPut('setlists', l); }
  S.restore = null; ACT.closeModal(); render();
  toast(`Copia restaurada: ${pl(plan.songs.length,'canción','canciones')} y ${pl(plan.setlists.length,'lista','listas')}` + (bad ? ` (${pl(bad,'documento no se pudo','documentos no se pudieron')} leer)` : ''));
}

function liveFromSet(sl, ix){ const it = sl.items[ix]; const s = songById(it.songId); return {songId:it.songId, semi: s && s.key && it.key ? Music.semiBetween(s.key, it.key) : 0, setlistId:sl.id, ix}; }

    </div>

  liveSong(b){ openLive({songId:b.dataset.id, semi:0}); },
  liveSet(b){ const sl = S.setlists.find(x=>x.id===b.dataset.id); if(!sl || !sl.items.length) return; openLive(liveFromSet(sl, +(b.dataset.ix||0))); },
  async saveToSet(){ const s = songById(S.cur.id); const sl = S.setlists.find(x=>x.id===$('#toSet').value); if(!sl||!s.key) return; const k = {i:Music.mod(s.key.i+S.cur.semi), minor:s.key.minor}; const it = sl.items.find(x=>x.songId===s.id); if(it) it.key = k; else sl.items.push({songId:s.id, key:k, notes:'', link:false}); await saveSetlist(sl); toast(`Guardado en “${sl.name}” en ${Music.keyName(k,S.prefs.spell)}`); },
  async delSong(b){ if(!armed(b, 'Toca otra vez para eliminar')) return; const s = songById(b.dataset.id); S.songs = S.songs.filter(x=>x!==s); S.index.delete(s.id); await dbDel('songs', s.id); if(s.sourceFileId && !S.songs.some(x=>x.sourceFileId===s.sourceFileId)) await dbDel('files', s.sourceFileId); for(const sl of S.setlists){ const n = sl.items.length; sl.items = sl.items.filter(i=>i.songId!==s.id); if(n!==sl.items.length) await saveSetlist(sl); } S.stack = []; go('biblioteca', {}, false); toast('Canción eliminada'); },
  homeKey(b){ S.lib.keys = new Set([+b.dataset.i]); S.lib.source = 'original'; S.lib.mode = 'all'; S.stack = []; go('biblioteca', {}, false); },
  libKey(b){ const i = +b.dataset.i; S.lib.keys.has(i) ? S.lib.keys.delete(i) : S.lib.keys.add(i); render(); },
  clearKeys(){ S.lib.keys.clear(); render(); },
  libMode(b){ S.lib.mode = b.dataset.v; render(); },
  libSource(b){ S.lib.source = b.dataset.v; render(); },
  libFav(){ S.lib.fav = !S.lib.fav; render(); },
  reviewPending(){ startReview(S.songs.filter(s=>s.status!=='ok' && !s.isExample).map(s=>s.id)); },
  reviewJobs(){ startReview(S.jobs.flatMap(j=>j.songIds)); },
  pick(){ $('#filepick').click(); },
  async confirmReview(){
    const s = songById(S.review.queue[S.review.pos]);
    const p = parseSongText($('#rv-text').value, {bodyOnly:true});
    s.title = $('#rv-title').value.trim() || 'Sin título'; s.artist = $('#rv-artist').value.trim();
    const kv = $('#rv-key').value; s.key = kv === '' ? null : {i:+kv, minor:$('#rv-mode').value==='min'};
    s.tags = $('#rv-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    s.sections = p.sections; s.conf = {title:'alta', artist:s.artist?'alta':'baja', key:s.key?'alta':'baja'};
    s.status = (p.stats.lyricLines || p.stats.chords) ? 'ok' : 'sin-texto';
    await saveSong(s); toast('Canción guardada'); nextReview();
  },
  skipReview(){ nextReview(); },
  async discardReview(b){ if(!armed(b, 'Toca otra vez para descartar')) return; const s = songById(S.review.queue[S.review.pos]); S.songs = S.songs.filter(x=>x!==s); S.index.delete(s.id); await dbDel('songs', s.id); if(s.sourceFileId && !S.songs.some(x=>x.sourceFileId===s.sourceFileId)) await dbDel('files', s.sourceFileId); nextReview(); },
  openSetlist(b){ go('servicio', {id:b.dataset.id}); },
  async addItem(b){ const sl = S.setlists.find(x=>x.id===S.route.params.id); const s = songById(b.dataset.id); sl.items.push({songId:s.id, key:s.key, notes:'', link:false}); await saveSetlist(sl); render(); toast(`Añadida: ${s.title}`); },
  async mvItem(b){ const sl = S.setlists.find(x=>x.id===S.route.params.id); const i = +b.dataset.ix, j = i + (+b.dataset.d); [sl.items[i], sl.items[j]] = [sl.items[j], sl.items[i]]; await saveSetlist(sl); render(); },
  async rmItem(b){ const sl = S.setlists.find(x=>x.id===S.route.params.id); sl.items.splice(+b.dataset.ix, 1); await saveSetlist(sl); render(); },
  async dupSet(b){ const sl = S.setlists.find(x=>x.id===b.dataset.id); const c = {id:uid(), name:sl.name+' (copia)', date:new Date().toISOString().slice(0,10), type:sl.type, items:sl.items.map(i=>({...i, key:i.key?{...i.key}:null})), createdAt:Date.now()}; await saveSetlist(c); go('servicio', {id:c.id}); toast('Lista duplicada'); },
  async delSet(b){ if(!armed(b, 'Toca otra vez para eliminar la lista')) return; S.setlists = S.setlists.filter(x=>x.id!==b.dataset.id); await dbDel('setlists', b.dataset.id); S.stack = []; go('servicios', {}, false); },
  prefSpell(b){ S.prefs.spell = b.dataset.v; savePrefs(); render(); },
  prefSize(b){ S.prefs.liveSize = Math.min(40, Math.max(14, S.prefs.liveSize + (+b.dataset.d))); savePrefs(); render(); },
  prefPal(b){ S.prefs.livePalette = b.dataset.v; savePrefs(); render(); },
  async exportBackup(b){
    b.disabled = true; const t = b.textContent; b.textContent = 'Preparando…';
    try{
      const {file, counts} = await buildBackup(); S.backup = file;
      const share = canShareFile(file);
      smallModal('Copia lista', `<p class="small">${pl(counts.songs,'canción','canciones')}, ${pl(counts.setlists,'lista','listas')} y ${pl(counts.files,'documento original','documentos originales')} · ${fmtSize(file.size)}</p>
        <p class="muted small">${share ? 'Toca “Guardar o enviar” y elige “Guardar en Archivos” (iCloud Drive) o envíatela por correo.' : 'Se descargará el archivo. Guárdalo en una nube o envíatelo por correo para tenerlo fuera de este equipo.'}</p>`,
        (share ? `<button class="btn pri" data-act="shareBackup">Guardar o enviar</button><button class="btn" data-act="downloadBackup">Descargar archivo</button>` : `<button class="btn pri" data-act="downloadBackup">Descargar archivo</button>`));
    }catch(e){ toast('No se pudo preparar la copia: ' + (e.message||'error')); }
    if(b.isConnected){ b.disabled = false; b.textContent = t; }
  },
  shareBackup(){ navigator.share({files:[S.backup], title:'Copia de 120 Music'}).then(() => { markBackup(); toast('Copia guardada'); }).catch(e => { if(e.name !== 'AbortError') toast('No se pudo compartir. Usa “Descargar archivo”.'); }); },
  downloadBackup(){ const u = URL.createObjectURL(S.backup); const a = document.createElement('a'); a.href = u; a.download = S.backup.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 30000); markBackup(); toast('Copia descargada'); },
  pickBackup(){ $('#backuppick').click(); },
  doRestore,
  async rmExamples(b){ if(!armed(b, 'Toca otra vez para quitar los ejemplos')) return; for(const s of S.songs.filter(x=>x.isExample)){ S.index.delete(s.id); await dbDel('songs', s.id); } S.songs = S.songs.filter(x=>!x.isExample); for(const sl of S.setlists.filter(x=>x.isExample)) await dbDel('setlists', sl.id); S.setlists = S.setlists.filter(x=>!x.isExample); render(); toast('Ejemplos eliminados'); },
  /* modo en vivo */
  liveClose: closeLive,
  liveStep(b){ S.live.semi = Music.semiNorm(S.live.semi + (+b.dataset.d)); renderLive(true); },
  liveKey(b){ const s = songById(S.live.songId); S.live.semi = Music.semiBetween(s.key, {i:+b.dataset.i}); S.live.panel = null; renderLive(true); },
  livePanel(b){ S.live.panel = S.live.panel === b.dataset.v ? null : b.dataset.v; renderLive(true); },
  liveSize(b){ S.prefs.liveSize = Math.min(40, Math.max(14, S.prefs.liveSize + (+b.dataset.d))); savePrefs(); renderLive(true); },
  liveOpen(b){ const v = S.live; v.history.push({songId:v.songId, semi:v.semi, ix:v.ix, setlistId:v.setlistId}); v.songId = b.dataset.id; v.semi = 0; v.panel = null; v.ix = null; v.setlistId = null; const s = songById(b.dataset.id); s.lastOpened = Date.now(); dbPut('songs', s); renderLive(); },
  liveBack(){ const v = S.live; const h = v.history.pop(); if(!h) return; Object.assign(v, h, {panel:null}); renderLive(); },
  liveNav(b){ const v = S.live; const sl = S.setlists.find(x=>x.id===v.setlistId); const ix = v.ix + (+b.dataset.d); if(ix<0||ix>=sl.items.length) return; Object.assign(v, liveFromSet(sl, ix), {panel:null}); renderLive(); },
  async liveSave(){ const v = S.live; const sl = S.setlists.find(x=>x.id===v.setlistId); const s = songById(v.songId); sl.items[v.ix].key = {i:Music.mod(s.key.i+v.semi), minor:s.key.minor}; await saveSetlist(sl); renderLive(true); toast(`Tono guardado en “${sl.name}”`); }
};
function armed(b, msg){ if(b.dataset.armed === '1') return true; b.dataset.armed = '1'; const t = b.textContent; b.textContent = msg; setTimeout(() => { if(b.isConnected){ b.dataset.armed = ''; b.textContent = t; } }, 3500); return false; }

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ S.stack = []; go(tab.dataset.tab, {}, false); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  if(b.classList.contains('star') || (b.dataset.act !== 'open' && b.closest('.item[data-act="open"]'))) e.stopPropagation();
  const fn = ACT[b.dataset.act]; if(fn) fn(b, e);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('.item[role="button"]')) { e.target.click(); }
  if(e.key === 'Escape'){ if(!$('#modal').hidden) ACT.closeModal(); else if(S.live) closeLive(); }
});
document.addEventListener('change', async e => {
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k) return;
  const sl = S.setlists.find(x=>x.id===S.route.params.id); if(!sl) return;
  const it = sl.items[+el.dataset.ix];
  if(k === 'itemKey'){ const s = songById(it.songId); it.key = {i:+el.value, minor:s.key.minor}; await saveSetlist(sl); render(); }
  if(k === 'itemNotes'){ it.notes = el.value; await saveSetlist(sl); }
  if(k === 'itemLink'){ it.link = el.checked; await saveSetlist(sl); render(); }
});
$('#backuppick').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) readBackupFile(f); });
$('#filepick').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if(S.route.view!=='importar') go('importar'); importFiles(f); });

/* ================= EJEMPLOS (canciones originales de muestra) ================= */

[Intro]

cuando el día comienza a nacer;

tu bondad es mi primera luz,

renueva mis fuerzas, yo vivo por ti;

  {title:'Refugio', text:`Tono: Em

async function seedExamples(){
  const made = [];
  for(const ex of EXAMPLES){ const s = songFromText(ex.text, {title:ex.title, sourceName:'Ejemplo'}); s.artist = 'Canción de muestra'; s.isExample = true; s.status = 'ok'; s.tags = ['ejemplo']; await saveSong(s); made.push(s); }
  const [a, r, c] = made;
  await saveSetlist({id:uid(), name:'Ejemplo · Culto del domingo', date:new Date().toISOString().slice(0,10), type:'Culto', isExample:true, createdAt:Date.now(),
    items:[{songId:a.id, key:{i:0, minor:false}, notes:'La directora pidió bajarla un tono (D → C)', link:true}, {songId:r.id, key:r.key, notes:'', link:false}, {songId:c.id, key:c.key, notes:'Intro solo piano', link:false}]});
}

/* ================= ARRANQUE ================= */
(async function init(){
  await dbOpen();
  const [songs, sets, prefs] = await Promise.all([dbAll('songs'), dbAll('setlists'), dbAll('prefs')]);
  S.songs = songs; S.setlists = sets; if(prefs[0]) Object.assign(S.prefs, prefs[0]);
  for(const s of S.songs) S.index.set(s.id, buildIndex(s));
  if(!S.prefs.seeded && !S.songs.length){ await seedExamples(); S.prefs.seeded = true; await savePrefs(); }
  render();
})();
</script>
